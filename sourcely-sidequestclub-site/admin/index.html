<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Admin | Side Quest Club</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Inter:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/assets/style.css">
<style>
.adm{max-width:1100px;margin:0 auto;padding:20px 16px 80px}
.adm label{display:block;font-weight:700;font-size:.9rem;margin:14px 0 4px}
.adm input[type=text],.adm input[type=password],.adm input[type=date],.adm select,.adm textarea{width:100%;font:inherit;padding:10px;border:3px solid #111;background:#fff;color:#111;border-radius:0}
.adm textarea{min-height:360px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9rem;line-height:1.5}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
.prev{border:3px dashed #111;padding:16px;background:#fff;min-height:200px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.plist{width:100%;border-collapse:collapse;margin-top:10px}
.plist td,.plist th{border-bottom:2px solid #ddd;padding:8px 6px;text-align:left;font-size:.95rem}
.pill{font-size:.75rem;font-weight:700;padding:2px 8px;border:2px solid #111}
.pill.pub{background:#F5FF3B}
.msg{margin-top:12px;font-weight:700}
.hint{font-size:.85rem;color:#555}
[hidden]{display:none!important}
</style></head>
<body><div class="adm">
<p><a href="/" style="text-decoration:none">← Side Quest Club</a></p>
<h1 style="font-size:1.8rem">Article admin</h1>

<div id="lock">
  <p class="hint">Only you can publish. The password is checked on the server, not on this page.</p>
  <label for="pw">Admin password</label>
  <input type="password" id="pw" autocomplete="current-password" style="max-width:360px">
  <div class="row"><button class="btn solid" id="unlock" type="button">Unlock</button></div>
  <div class="msg" id="lockmsg" role="status"></div>
</div>

<div id="app" hidden>
  <div class="row" style="justify-content:space-between"><h2 style="margin:0">Your articles</h2><span><button class="btn solid" id="newBtn" type="button">+ New article</button> <button class="btn" id="lockBtn" type="button">Lock</button></span></div>
  <table class="plist" id="plist"><tbody></tbody></table>

  <div id="editor" hidden>
    <h2 id="edTitle" style="margin-top:36px">New article</h2>
    <label for="title">Title</label><input type="text" id="title" maxlength="160">
    <label for="summary">Short summary <span class="hint">(shows under the title and on the homepage card)</span></label><input type="text" id="summary" maxlength="240">
    <div class="cols">
      <div><label for="kind">Type</label><select id="kind"><option>Essay</option><option>Guide</option><option>News</option><option>Note</option></select></div>
      <div><label for="date">Date</label><input type="date" id="date"></div>
    </div>
    <label for="slug">Web address ending <span class="hint">(letters, numbers, dashes; made from the title if empty)</span></label><input type="text" id="slug" maxlength="60">
    <div class="cols" style="margin-top:6px">
      <div>
        <label for="body">Article text</label>
        <textarea id="body" spellcheck="true" placeholder="Paste or write here. Use ## for a heading, - for bullets, > for a hand-written aside."></textarea>
        <div class="row"><label class="btn" style="margin:0;cursor:pointer">Load a .txt or .md file<input type="file" id="file" accept=".txt,.md,.markdown,text/plain" hidden></label></div>
        <p class="hint"><code>## Heading</code> · <code>### Smaller heading</code> · <code>- bullet</code> · <code>1. numbered</code> · <code>&gt; hand-written aside</code> · <code>**bold**</code> · <code>*italic*</code> · <code>[text](https://link)</code> · blank line between paragraphs</p>
      </div>
      <div><label>Preview</label><div class="prev"><article id="prev"></article></div></div>
    </div>
    <div class="row">
      <button class="btn solid" id="pub" type="button">Publish</button>
      <button class="btn" id="draft" type="button">Save as draft</button>
      <button class="btn" id="cancel" type="button">Close editor</button>
      <button class="btn" id="del" type="button" style="margin-left:auto" hidden>Delete</button>
    </div>
    <div class="msg" id="msg" role="status"></div>
  </div>
</div>
</div>
<script src="/assets/posts.js"></script>
<script src="/assets/admin.js"></script>
</body></html>
